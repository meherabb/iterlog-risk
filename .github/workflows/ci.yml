name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install CPU-only dependencies
        run: |
          python -m pip install --upgrade pip
          # CI runs CPU-only: skip the pinned +cu128 torch build and use the
          # standard CPU wheel instead, since GitHub-hosted runners have no GPU.
          grep -v "^torch\|^torchvision\|extra-index-url" requirements.txt > /tmp/requirements-ci.txt
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r /tmp/requirements-ci.txt
          pip install -e .

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (black)
        run: black --check .

      - name: Run CPU-only unit tests
        run: pytest -m "not gpu" --cov=src --cov-report=xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  # Placeholder for the GPU-dependent Tier A/B/C integration tests, which need a real
  # accelerator and are documented (not automated) in docs/REPRODUCING.md instead.
  # A self-hosted GPU runner can be pointed at this job once available.
